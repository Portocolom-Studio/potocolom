[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "potocolom-backend"
version = "0.1.4"
description = "potocolom API server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.31,<1",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "boto3>=1.34,<2",
    "argon2-cffi>=23,<26",
    "cryptography>=50,<51",
    "httpx>=0.27,<1",
    "jsonschema>=4.21,<5",
    "referencing>=0.35,<1",  # manifests.py catches Unresolvable directly
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "httpx>=0.27,<1",
    "ruff>=0.6,<0.16",
    "mypy>=2,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

# Keep the pre-0.16 default set until we deliberately adopt the expanded rules.
# ruff 0.16 enables B008 (breaks FastAPI Depends) and many others by default.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "TID251"]

# The services talk only over the socket protocol (docs/connection-handling.md).
[tool.ruff.lint.flake8-tidy-imports.banned-api."worker"]
msg = "The backend and the worker talk only over the socket protocol (docs/connection-handling.md). Do not import the worker package here."

# scripts/ are dev and release tools that run worker code on purpose, so they are exempt.
[tool.ruff.lint.per-file-ignores]
"../scripts/**" = ["TID251"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "boto3.*", "botocore.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
relative_files = true
