[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "potocolom-worker"
version = "0.0.1"
description = "potocolom inference worker"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.4,<3",
    "websockets>=16,<17",
    "httpx>=0.27,<1",
    "pillow>=12,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "ruff>=0.6,<0.16",
    "mypy>=2,<3",
]
# Install torch for your device first (CUDA wheels from PyPI; ROCm and CPU
# wheels from the matching https://download.pytorch.org/whl/ index), then
# install this extra. See docs/local-development.md for the ROCm notes.
inference = [
    "torch>=2.5,<3",
    "diffusers>=0.39,<1",
    "transformers>=5,<6",
    "accelerate>=1,<2",
    # Upper bound tracks the torch in the worker base images (2.9.0 for both
    # Dockerfile.worker-cuda and Dockerfile.worker-rocm). torchao 0.18 imports
    # torch.nn.functional.ScalingType, which lands in torch 2.10, so an
    # unpinned resolve installs a torchao that cannot import against 2.9 and
    # every generation fails at diffusers import time. Raise both together.
    "torchao>=0.17,<0.18",
    "peft>=0.13,<1",
    "spandrel>=0.4,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.ruff]
line-length = 100

# Keep the pre-0.16 default set until we deliberately adopt the expanded rules.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["worker"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["torch.*", "torchao.*", "diffusers.*", "spandrel.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
