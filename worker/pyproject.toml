[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "potocolom-worker"
version = "0.1.4"
description = "potocolom inference worker"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.4,<3",
    "websockets>=16,<17",
    "httpx>=0.27,<1",
    "pillow>=13,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.6,<0.16",
    "mypy>=2,<3",
    "huggingface-hub>=1.32,<2",
]
# Install torch for your device first (CUDA wheels from PyPI; ROCm and CPU
# wheels from the matching https://download.pytorch.org/whl/ index), then
# install this extra. See docs/local-development.md for the ROCm notes.
inference = [
    "torch>=2.5,<3",
    "diffusers @ https://github.com/huggingface/diffusers/archive/3b56af0c5268049588cf470e38955f4c18002498.tar.gz",
    "huggingface-hub>=1.32,<2",
    "transformers>=5,<6",
    "accelerate>=1,<2",
    "omegaconf>=2.3,<3",
    # Cap below 0.18 until the worker images move to torch 2.10
    # (Dockerfile.worker-cuda and Dockerfile.worker-rocm). torchao 0.18 imports
    # torch.nn.functional.ScalingType, which lands in torch 2.10, so an
    # unpinned resolve installs a torchao that cannot import against 2.9 and
    # every generation fails at diffusers import time. Raise both together.
    "torchao>=0.17,<0.18",
    "peft>=0.13,<1",
    "spandrel>=0.4,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["worker", "vendor/iris3b"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
exclude = ["vendor/iris3b/**"]

# Keep the pre-0.16 default set until we deliberately adopt the expanded rules.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["worker"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["torch.*", "torchao.*", "diffusers.*", "spandrel.*", "transformers.*", "iris3b.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
relative_files = true
