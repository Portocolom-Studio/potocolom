# Every PR reports this check; the changes job skips backend unless its files changed (issue #13).
# scripts/ is included because the backend job lints it (see the Makefile).
name: backend

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/backend.yml"

permissions:
  contents: read
  pull-requests: read

# A new push to a pull request cancels the runs of the head it replaced.
# A push to main groups by commit, so a merge is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    with:
      paths: |
        backend/**
        scripts/**
        Makefile
        .github/workflows/backend.yml
  backend:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run != 'false') }}
    # Self-hosted on the reference desktop when GitHub-hosted minutes are exhausted.
    # Switch back to ubuntu-latest when hosted quota is available (docs/self-hosted-runner.md).
    runs-on: [self-hosted, Linux, X64, potocolom]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    services:
      # The db-marked tests run against this; without it they self-skip.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: potocolom
          POSTGRES_PASSWORD: potocolom
          POSTGRES_DB: potocolom
        ports:
          # No fixed host port. Four self-hosted runners share one machine, so
          # two backend jobs at once both tried to bind the same port and the
          # second died before a single test ran. Docker picks a free one and
          # the step below reads it back.
          - 5432
        options: >-
          --health-cmd "pg_isready -U potocolom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: python3.11 -m venv .venv
      - run: .venv/bin/pip install -e ".[dev]"
      # The Makefile target is the single definition of what the job checks.
      - run: make verify-backend
        working-directory: .
        env:
          DATABASE_URL: >-
            postgresql://potocolom:potocolom@localhost:${{ job.services.postgres.ports['5432'] }}/potocolom_test
      - run: make check-python-deps
        working-directory: .
      # The shallow checkout has no base branch. Compare with the base commit the pull request
      # was built on, not the branch tip, which may have moved after the merge commit was made.
      - name: Fetch the pull request base
        if: ${{ github.event_name == 'pull_request' }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: Check the API against the pull request base
        if: ${{ github.event_name == 'pull_request' }}
        run: make check-openapi
        working-directory: .
        env:
          OPENAPI_BASE_REF: ${{ github.event.pull_request.base.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backend-test-reports
          path: .local/reports/backend/
          include-hidden-files: true
          retention-days: 14
