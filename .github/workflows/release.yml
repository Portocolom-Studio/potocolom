name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, potocolom]
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: potocolom
          POSTGRES_PASSWORD: potocolom
          POSTGRES_DB: potocolom
        ports: [5432]
        options: >-
          --health-cmd "pg_isready -U potocolom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          want="${VERSION#v}"
          expect_version() {
            found="$1"
            file="$2"
            if [[ "$found" != "$want" ]]; then
              echo "::error::$file version $found does not match tag $VERSION"
              exit 1
            fi
          }
          expect_version "$(sed -n 's/^version = "\(.*\)"/\1/p' backend/pyproject.toml)" backend/pyproject.toml
          expect_version "$(sed -n 's/^version = "\(.*\)"/\1/p' worker/pyproject.toml)" worker/pyproject.toml
          expect_version "$(node -p "require('./frontend/package.json').version")" frontend/package.json
          git merge-base --is-ancestor HEAD origin/main
      - run: make setup
      - run: make verify
        env:
          DATABASE_URL: postgresql://potocolom:potocolom@localhost:${{ job.services.postgres.ports['5432'] }}/potocolom_test
          POSTGRES_ADMIN_URL: postgresql://potocolom:potocolom@localhost:${{ job.services.postgres.ports['5432'] }}/postgres
      - run: |
          python3.11 -m venv worker/.venv-inference
          worker/.venv-inference/bin/pip install --upgrade pip
          worker/.venv-inference/bin/pip install 'torch==2.9.0' 'torchvision==0.24.0' --index-url https://download.pytorch.org/whl/cpu
          worker/.venv-inference/bin/pip install -e './worker[dev,inference]'
          make verify-worker-inference

  publish:
    needs: verify
    runs-on: [self-hosted, Linux, X64, potocolom]
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: echo "DOCKER_CONFIG=$RUNNER_TEMP/potocolom-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - id: images
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          owner="${REPOSITORY%%/*}"
          registry="ghcr.io/${owner,,}"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          for image in api worker-cuda worker-rocm; do
            if [[ "$image" == api ]]; then
              tag="$registry/potocolom-api:$VERSION"
            else
              tag="$registry/potocolom-worker:$VERSION-${image#worker-}"
            fi
            docker build --pull --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.version=$VERSION" \
              -f "deploy/docker/Dockerfile.$image" -t "$tag" .
          done
      - name: Check exact worker images and API
        env:
          REGISTRY: ${{ steps.images.outputs.registry }}
        run: |
          # The self-host bundle is built here so the recovery proof below
          # runs the exact scripts a release install receives.
          tar -czf "potocolom-$VERSION-selfhost.tar.gz" deploy/compose/compose.yml deploy/compose/.env.example \
            scripts/preflight.sh scripts/gpu-profile.sh scripts/ensure-env.sh scripts/install-lock.sh scripts/auth-enable.sh \
            scripts/backup.sh scripts/restore.sh worker/models/*.json
          bundle="$RUNNER_TEMP/selfhost-bundle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf "$bundle" && mkdir -p "$bundle"
          tar -xzf "potocolom-$VERSION-selfhost.tar.gz" -C "$bundle"
          mkdir release-candidate
          sed "s/__POTOCOLOM_VERSION__/$VERSION/" scripts/install.sh > release-candidate/install.sh
          cp "potocolom-$VERSION-selfhost.tar.gz" release-candidate/
          python3 - "$VERSION" <<'PY'
          import hashlib, pathlib, sys
          release = pathlib.Path("release-candidate")
          bundle = f"potocolom-{sys.argv[1]}-selfhost.tar.gz"
          lines = [f"{hashlib.sha256((release / name).read_bytes()).hexdigest()}  {name}"
                   for name in ("install.sh", bundle)]
          (release / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          for image in worker-cuda worker-rocm; do
            docker run --rm --entrypoint python "$REGISTRY/potocolom-worker:$VERSION-${image#worker-}" \
              -c 'import torch, diffusers, transformers, torchao; print(torch.__version__, diffusers.__version__)'
            COMPOSE_SMOKE_PROJECT="release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${image}" \
              COMPOSE_SMOKE_API_IMAGE="$REGISTRY/potocolom-api:$VERSION" \
              COMPOSE_SMOKE_WORKER_IMAGE="$REGISTRY/potocolom-worker:$VERSION-${image#worker-}" scripts/compose-smoke.sh
            # The same published images, this time as one recovery point:
            # back up, delete the stack, restore and sign in to the restored
            # account (issue #693).
            COMPOSE_SMOKE_API_IMAGE="$REGISTRY/potocolom-api:$VERSION" \
              COMPOSE_SMOKE_WORKER_IMAGE="$REGISTRY/potocolom-worker:$VERSION-${image#worker-}" \
              RECOVERY_SCRIPTS_DIR="$bundle/scripts" scripts/test-backup-restore.sh
          done
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.74.0
          image-ref: ${{ steps.images.outputs.registry }}/potocolom-api:${{ env.VERSION }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          output: trivy-api.txt
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.74.0
          image-ref: ${{ steps.images.outputs.registry }}/potocolom-worker:${{ env.VERSION }}-cuda
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          output: trivy-worker-cuda.txt
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.74.0
          image-ref: ${{ steps.images.outputs.registry }}/potocolom-worker:${{ env.VERSION }}-rocm
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          output: trivy-worker-rocm.txt
      - name: Rehearse exact installer and previous release on GPU
        timeout-minutes: 60
        run: |
          python3 - "$VERSION" <<'PY' > previous-version.txt
          import json, re, subprocess, sys
          current = tuple(map(int, sys.argv[1][1:].split(".")))
          output = subprocess.check_output([
              "gh", "release", "list", "--limit", "100", "--json", "tagName,isDraft,isPrerelease"
          ], text=True)
          versions = []
          for item in json.loads(output):
              tag = item["tagName"]
              if item["isDraft"] or item["isPrerelease"] or not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
                  continue
              parsed = tuple(map(int, tag[1:].split(".")))
              if parsed < current:
                  versions.append((parsed, tag))
          if not versions:
              raise SystemExit("no previous published release found")
          print(max(versions)[1])
          PY
          previous="$(cat previous-version.txt)"
          mkdir previous-release
          gh release download "$previous" --dir previous-release \
            --pattern install.sh --pattern "potocolom-$previous-selfhost.tar.gz" --pattern SHA256SUMS
          flock /tmp/potocolom-release-check-gpu.lock \
            python3 scripts/release-check.py --version "$VERSION" --release-dir release-candidate \
              --install-dir "$RUNNER_TEMP/release-check-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --previous-release-dir previous-release --previous-version "$previous" --profile rocm
      - name: Remove owned installer test resources
        if: always()
        timeout-minutes: 5
        env:
          CHECK_DIR: ${{ runner.temp }}/release-check-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - "$CHECK_DIR" <<'PY'
          import importlib.util, pathlib, sys
          spec = importlib.util.spec_from_file_location("release_check", "scripts/release-check.py")
          check = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(check)
          check.cleanup_rehearsal(pathlib.Path(sys.argv[1]))
          PY
      - name: Publish the tested images and create a draft release
        env:
          REGISTRY: ${{ steps.images.outputs.registry }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          container=$(docker create "$REGISTRY/potocolom-api:$VERSION")
          trap 'docker rm "$container"' EXIT
          mkdir release-static
          docker cp "$container:/app/static/." release-static/
          tar -czf "potocolom-$VERSION-static.tar.gz" -C release-static .
          sed "s/__POTOCOLOM_VERSION__/$VERSION/" scripts/install.sh > install.sh
          gh release create "$VERSION" --verify-tag --draft --title "potocolom $VERSION" \
            --notes-file docs/release-checklist.md
          for image in "$REGISTRY/potocolom-api:$VERSION" \
            "$REGISTRY/potocolom-worker:$VERSION-cuda" "$REGISTRY/potocolom-worker:$VERSION-rocm"; do
            docker push "$image"
            docker inspect --format '{{index .RepoDigests 0}}' "$image" >> images.txt
          done
          sha256sum "potocolom-$VERSION-static.tar.gz" "potocolom-$VERSION-selfhost.tar.gz" install.sh > SHA256SUMS
          gh release upload "$VERSION" \
            "potocolom-$VERSION-static.tar.gz" "potocolom-$VERSION-selfhost.tar.gz" install.sh \
            images.txt SHA256SUMS trivy-*.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-scan-reports
          path: trivy-*.txt
          retention-days: 30
      - name: Remove release credentials
        if: always()
        run: |
          [[ -n "${DOCKER_CONFIG:-}" ]] || exit 0
          docker logout ghcr.io || true
          rm -rf "$DOCKER_CONFIG"
