# The shipped API image contains backend/ and built frontend/ files, so both
# changes patterns include them with deploy/. Otherwise route or static asset changes
# could bypass the compose smoke test.
# The simulated worker means no GPU is needed (issue #13 keeps one workflow per area).
name: deploy

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - "scripts/compose-smoke.sh"
      - "scripts/smoke-*"
      - "scripts/backup.sh"
      - "scripts/restore.sh"
      - "scripts/test-backup-restore.sh"
      - "scripts/test-postgres-ready.sh"
      - "scripts/release-check.py"
      - "scripts/tests/test_release_check*.py"
      - "Makefile"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  pull-requests: read

# A new push to a pull request cancels the runs of the head it replaced.
# A push to main groups by commit, so a merge is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    with:
      paths: |
        backend/**
        frontend/**
        deploy/**
        scripts/compose-smoke.sh
        scripts/smoke-*
        scripts/backup.sh
        scripts/restore.sh
        scripts/test-backup-restore.sh
        scripts/test-postgres-ready.sh
        scripts/release-check.py
        scripts/tests/test_release_check*.py
        Makefile
        .github/workflows/deploy.yml
  deploy:
    needs: changes
    env:
      # Names every compose project, container and image this job creates, so
      # the last step can remove them when a newer push cancels the run.
      CI_RUN_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run != 'false') }}
    # Self-hosted: docs/self-hosted-runner.md (needs a working docker daemon).
    runs-on: [self-hosted, Linux, X64, potocolom]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/tests -p 'test_release_check*.py'
      - run: make verify-compose
      # Builds the api and worker-sim images and drives a real generation
      # through them; the script cleans up its containers and volumes.
      - run: scripts/compose-smoke.sh
        timeout-minutes: 20
        env:
          # Four self-hosted runners share one machine, so two deploy jobs can
          # run at once. With one project name they reused and then removed
          # each other's containers mid-test.
          COMPOSE_SMOKE_PROJECT: potocolom-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      # Checks that the postgres healthcheck waits for the real server, not the
      # first-start server of a new volume (issue #882). Needs only docker.
      - run: scripts/test-postgres-ready.sh
        timeout-minutes: 5
      # Backs up a populated stack, removes it, restores the backup into a
      # second project and signs in to the restored account (issue #693). The
      # script names its own p693-* projects and removes them on exit.
      - run: scripts/test-backup-restore.sh
        timeout-minutes: 20
      # A cancelled run can kill a script before its EXIT trap finishes, and
      # each run uses its own names, so nothing later would remove them.
      - name: Remove this run's compose projects
        if: always()
        timeout-minutes: 5
        run: |
          for p in $(docker compose ls -a -q | grep -E -- "-${CI_RUN_TAG}\$" || true); do
            docker compose -p "$p" down -v --remove-orphans || true
          done
          docker rm -f "potocolom-pgready-${CI_RUN_TAG}" >/dev/null 2>&1 || true
          docker image ls --format '{{.Repository}}' | grep -E -- "-${CI_RUN_TAG}-" | xargs -r docker image rm -f || true
