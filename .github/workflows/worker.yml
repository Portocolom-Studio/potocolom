# Every PR reports both checks; the changes job skips worker work unless its files changed (issue #13).
name: worker

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "scripts/check-python-deps.sh"
      - "Makefile"
      - ".github/workflows/worker.yml"

permissions:
  contents: read
  pull-requests: read

# A new push to a pull request cancels the runs of the head it replaced.
# A push to main groups by commit, so a merge is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    with:
      paths: |
        worker/**
        scripts/check-python-deps.sh
        Makefile
        .github/workflows/worker.yml
  inference-cpu:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run != 'false') }}
    runs-on: [self-hosted, Linux, X64, potocolom]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: python3.11 -m venv .venv-inference
      - run: .venv-inference/bin/pip install --upgrade pip
      - run: >-
          .venv-inference/bin/pip install
          torch==2.9.0 torchvision==0.24.0
          --index-url https://download.pytorch.org/whl/cpu
          --retries 10 --resume-retries 20 --timeout 60
      - run: .venv-inference/bin/pip install -e ".[dev,inference]"
      - run: make verify-worker-inference
        working-directory: .
      - run: make check-python-deps
        working-directory: .

  worker:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run != 'false') }}
    # Self-hosted: docs/self-hosted-runner.md (venv avoids Debian PEP 668).
    runs-on: [self-hosted, Linux, X64, potocolom]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: python3.11 -m venv .venv
      - run: .venv/bin/pip install -e ".[dev]"
      # The Makefile target is the single definition of what the job checks.
      - run: make verify-worker
        working-directory: .
      - run: make check-python-deps
        working-directory: .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: worker-test-reports
          path: .local/reports/worker/
          include-hidden-files: true
          retention-days: 14
