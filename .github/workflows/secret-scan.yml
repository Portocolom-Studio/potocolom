# Gitleaks scans for committed credentials: the commits a pull request adds,
# or the pushed tree on main. Every run first executes the canary self-test,
# which plants a run-time-generated token in a temp directory and asserts the
# scanner catches it without ever printing it (issue #691).
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    # Self-hosted: docs/self-hosted-runner.md
    runs-on: [self-hosted, Linux, X64, potocolom]
    steps:
      # Bounded because a hung checkout would hold the single self-hosted
      # runner against every other job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
        timeout-minutes: 5
      - name: Canary self-test
        run: bash scripts/test-secret-scan.sh
        timeout-minutes: 10
      - name: Scan the commits the pull request adds
        if: github.event_name == 'pull_request'
        run: bash scripts/secret-scan.sh range "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
        timeout-minutes: 15
      - name: Scan the pushed tree
        if: github.event_name == 'push'
        run: bash scripts/secret-scan.sh tree
        timeout-minutes: 10
