name: changes

on:
  workflow_call:
    inputs:
      paths:
        description: Newline-separated changed-file glob patterns
        required: true
        type: string
    outputs:
      run:
        description: Whether any changed file matches the patterns
        value: ${{ jobs.changes.outputs.run }}

jobs:
  changes:
    runs-on: [self-hosted, Linux, X64, potocolom]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.match.outputs.run }}
    steps:
      - name: Match changed files
        id: match
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PATHS: ${{ inputs.paths }}
        run: |
          python3 - <<'PY'
          import fnmatch
          import os
          import subprocess

          event = os.environ["EVENT_NAME"]
          force_run = False
          if event == "pull_request":
              command = [
                  "gh", "api", "--paginate",
                  f"repos/{os.environ['GH_REPOSITORY']}/pulls/{os.environ['PR_NUMBER']}/files",
                  "--jq", ".[].filename",
              ]
              result = subprocess.run(command, check=True, text=True, capture_output=True)
              files = result.stdout.splitlines()
          elif event == "push":
              before = os.environ["EVENT_BEFORE"]
              if before and set(before) == {"0"}:
                  files = []
                  force_run = True
              else:
                  command = [
                      "gh", "api",
                      f"repos/{os.environ['GH_REPOSITORY']}/compare/{before}...{os.environ['COMMIT_SHA']}",
                      "--jq", ".files[].filename",
                  ]
                  result = subprocess.run(command, check=True, text=True, capture_output=True)
                  files = result.stdout.splitlines()
          else:
              files = []
              force_run = True

          patterns = [line.strip() for line in os.environ["PATHS"].splitlines() if line.strip()]
          matched = next((
              (filename, pattern)
              for filename in files
              for pattern in patterns
              if fnmatch.fnmatchcase(filename, pattern)
              or (pattern.startswith("**/") and fnmatch.fnmatchcase(filename, pattern[3:]))
          ), None)
          run = force_run or matched is not None
          if matched is not None:
              print(f"Matched {matched[0]} with {matched[1]}")
          elif force_run:
              print("Running because this event has no file filter")
          else:
              print("No changed file matched")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={str(run).lower()}\n")
          PY
