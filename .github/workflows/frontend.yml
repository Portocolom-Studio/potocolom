# One workflow per component, triggered only when its files change (issue #13).
name: frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "Makefile"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "Makefile"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  frontend:
    # Self-hosted: docs/self-hosted-runner.md (system node 24, not setup-node).
    runs-on: [self-hosted, Linux, X64, potocolom]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: npm ci
      # The sign-in gate boots the real API against a throwaway database, so
      # it needs the backend venv the test drives (scripts/test-signin-cookie.mjs).
      - run: python3.11 -m venv backend/.venv && backend/.venv/bin/pip install -e ./backend
        working-directory: .
      # The Makefile target is the single definition of what the job checks.
      - run: make verify-frontend
        working-directory: .
