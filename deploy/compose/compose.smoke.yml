# Standalone stack for scripts/compose-smoke.sh (simulated worker, no GPU).
# Uses an alternate host port so it does not collide with a dev API on :8080.
services:
  # Same image as the API, started as root only for this chown. No secrets and
  # no network: the API image's USER is 10001, so the override is what makes
  # the one-shot root. An empty volume has nothing to change.
  assets-init:
    image: ${COMPOSE_SMOKE_API_IMAGE:-${COMPOSE_PROJECT_NAME}-api}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    user: "0:0"
    network_mode: none
    restart: "no"
    volumes:
      - assets:/data/assets
    command: ["sh", "-c", "find /data/assets -xdev ! -user 10001 -exec chown -h 10001:10001 {} +"]

  api:
    image: ${COMPOSE_SMOKE_API_IMAGE:-${COMPOSE_PROJECT_NAME}-api}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    ports:
      - "127.0.0.1:${COMPOSE_SMOKE_PORT:-18080}:8080"
    environment:
      # Names of their own, not AUTH_MODE and ROOT_KEYS: compose-smoke.sh reads
      # the operator's deploy/compose/.env, which may well enable accounts. The
      # backup and restore test sets these to run the same stack with accounts.
      AUTH_MODE: ${SMOKE_AUTH_MODE:-none}
      ROOT_KEYS: ${SMOKE_ROOT_KEYS:-}
      DATABASE_URL: postgresql://potocolom:${POSTGRES_PASSWORD}@postgres/potocolom
      STORAGE_BACKEND: local
      PUBLIC_URL: http://localhost:${COMPOSE_SMOKE_PORT:-18080}
      INTERNAL_URL: http://api:8080
      FLEET_TOKEN_KEY: ${FLEET_SECRET:-smoke-fleet-secret}
    volumes:
      - assets:/data/assets
    depends_on:
      assets-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: potocolom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: potocolom
    volumes:
      - pgdata:/var/lib/postgresql/data
    # TCP, not the socket: see deploy/compose/compose.yml (issue #882).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U potocolom"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker-sim:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker-sim
    environment:
      API_URL: ws://api:8080/api/v1/fleet
      # Non-empty by default: the smoke run is what proves a keyed stack still
      # registers its worker, which a permissive default would never exercise.
      FLEET_TOKEN: ${FLEET_SECRET:-smoke-fleet-secret}
    depends_on:
      - api

volumes:
  pgdata:
  assets:
