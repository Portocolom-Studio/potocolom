# Self-hosted stack: one API (SPA + backend), PostgreSQL and one GPU worker.
# Shape matches docs/blueprint.md; no Redis, billing or safety services.
# A release install (scripts/install.sh) pulls the image: tags below; a source
# checkout builds them with `up --build`, tagged :dev unless POTOCOLOM_VERSION is set.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    logging: *default-logging
    restart: unless-stopped
    image: ghcr.io/portocolom-studio/potocolom-api:${POTOCOLOM_VERSION:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      # Unset, the API follows the auth mode its database records. Set, it is
      # an override that must agree with the database (docs/self-hosting.md).
      AUTH_MODE: ${AUTH_MODE:-}
      ROOT_KEYS: ${ROOT_KEYS:-}
      # Sign-in providers and mail. Empty by default: a provider is offered only
      # with its credentials, and mail stays off until EMAIL_BACKEND names a backend.
      OAUTH_PROVIDERS: ${OAUTH_PROVIDERS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-none}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      DATABASE_URL: postgresql://potocolom:${POSTGRES_PASSWORD}@postgres/potocolom
      STORAGE_BACKEND: local
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      INTERNAL_URL: ${INTERNAL_URL:-http://api:8080}
      TELEMETRY: ${TELEMETRY:-true}
      FLEET_TOKEN_KEY: ${FLEET_SECRET}
    volumes:
      - assets:/data/assets
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    logging: *default-logging
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_USER: potocolom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: potocolom
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U potocolom"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    logging: *default-logging
    restart: unless-stopped
    profiles: ["gpu"]
    image: ghcr.io/portocolom-studio/potocolom-worker:${POTOCOLOM_VERSION:-dev}-cuda
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker-cuda
    environment:
      DEVICE: cuda
      API_URL: ws://api:8080/api/v1/fleet
      MODELS_DIR: /models
      VRAM_RESERVE_MB: ${VRAM_RESERVE_MB:-1536}
      # Gated repositories (sd35-medium) need a Hugging Face read token; the
      # hub client picks HF_TOKEN up from the environment. Empty is fine when
      # no gated model is enabled.
      HF_TOKEN: ${HF_TOKEN:-}
      FLEET_TOKEN: ${FLEET_SECRET}
      CUDA_VISIBLE_DEVICES:
      # Shared host cache (docs/self-hosting.md "Share an existing model cache").
      # Empty: the worker runs as root. Set by the installer, the worker drops to
      # this uid and gid (deploy/docker/worker-entrypoint.sh).
      WORKER_UID: ${WORKER_UID:-}
      WORKER_GID: ${WORKER_GID:-}
      HF_HUB_CACHE: ${HF_CACHE_DIR:-/root/.cache/huggingface/hub}
    volumes:
      - models:/models
      # Downloaded model weights survive container recreation. HF_CACHE_DIR in
      # .env names a host hub directory, mounted at the same path.
      - ${HF_CACHE_DIR:-hf-cache}:${HF_CACHE_DIR:-/root/.cache/huggingface}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - api

  # AMD worker (docker compose --profile rocm). Same volumes as the NVIDIA
  # worker: run one profile or the other, not both.
  worker-rocm:
    logging: *default-logging
    restart: unless-stopped
    profiles: ["rocm"]
    image: ghcr.io/portocolom-studio/potocolom-worker:${POTOCOLOM_VERSION:-dev}-rocm
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker-rocm
    environment:
      DEVICE: rocm
      API_URL: ws://api:8080/api/v1/fleet
      MODELS_DIR: /models
      VRAM_RESERVE_MB: ${VRAM_RESERVE_MB:-1536}
      # Gated repositories (sd35-medium) need a Hugging Face read token; the
      # hub client picks HF_TOKEN up from the environment. Empty is fine when
      # no gated model is enabled.
      HF_TOKEN: ${HF_TOKEN:-}
      FLEET_TOKEN: ${FLEET_SECRET}
      HIP_VISIBLE_DEVICES:
      # Shared host cache: see the worker service above.
      WORKER_UID: ${WORKER_UID:-}
      WORKER_GID: ${WORKER_GID:-}
      HF_HUB_CACHE: ${HF_CACHE_DIR:-/root/.cache/huggingface/hub}
    volumes:
      - models:/models
      - ${HF_CACHE_DIR:-hf-cache}:${HF_CACHE_DIR:-/root/.cache/huggingface}
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    depends_on:
      - api

  # Simulated worker for smoke tests (docker compose --profile smoke).
  worker-sim:
    logging: *default-logging
    restart: unless-stopped
    profiles: ["smoke"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker-sim
    environment:
      API_URL: ws://api:8080/api/v1/fleet
      FLEET_TOKEN: ${FLEET_SECRET}
    depends_on:
      - api

volumes:
  pgdata:
  assets:
  models:
  hf-cache:
