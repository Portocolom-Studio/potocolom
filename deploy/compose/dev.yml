# Development dependencies only. The API server, frontend dev server and worker
# run natively for hot reload and debugger access (docs/local-development.md).
# The full self-hosted stack ships with issue #18.
#
# Named so this file does not share Docker Compose project "compose" with
# compose.yml (same directory). That collision reused compose-postgres-1 with
# a different POSTGRES_PASSWORD and orphaned the self-hosted api/worker.
name: potocolom-dev

services:
  postgres:
    image: postgres:16
    ports:
      # Override when 5432 is taken by another PostgreSQL on the host, and set
      # DATABASE_URL to the same port for the backend and the tests. Give the
      # test URL a database name of its own: an exported DATABASE_URL is shared
      # by every run in that shell, and the suite otherwise names one per run
      # so two runs cannot collide (backend/tests/conftest.py).
      - "${DEV_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: potocolom
      POSTGRES_PASSWORD: potocolom
      POSTGRES_DB: potocolom
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Redis, MinIO and Mailpit are cloud-profile substitutes: nothing in the
  # native dev loop connects to them (storage_backend defaults to local, the
  # job queue and relay are in-process). Opt in with --profile cloud-sim.
  redis:
    profiles: ["cloud-sim"]
    image: redis:7
    ports:
      - "6379:6379"

  # Host ports are offset from the defaults (9000, 9001, 1025, 8025) because
  # development machines often run other services on them.
  minio:
    profiles: ["cloud-sim"]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000" # S3 API
      - "9101:9001" # web console
    environment:
      MINIO_ROOT_USER: potocolom
      MINIO_ROOT_PASSWORD: potocolom
    volumes:
      - miniodata:/data

  mailpit:
    profiles: ["cloud-sim"]
    # Pinned by digest: the image publishes no version tag label.
    image: axllent/mailpit@sha256:3bd7c2f2696deb35a4780d152b404dceec99cb041b942c0877b3b22384714f85
    ports:
      - "1125:1025" # SMTP
      - "8125:8025" # web UI

volumes:
  pgdata:
  miniodata:
